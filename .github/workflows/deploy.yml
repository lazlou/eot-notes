name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger when pushing to 'main'

permissions:
  contents: write  # Allows write access to push changes to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full git history for last_updated dates

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Jupyter Book
        run: |
          jupyter-book build .

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          ghp-import -n -p -f -b gh-pages _build/html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}