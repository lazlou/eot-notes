#######################################################################################
# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: EOT Web Archive
author: lazlou
exclude_patterns: [_build, .DS_Store, .git, .github, "**.ipynb_checkpoints", "README.md"]

#######################################################################################
# Jupyter Notebook settings
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: "off" # or "auto" to run during build

#######################################################################################
# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

#######################################################################################
# Citations (equivalent to sphinx.config.bibtex_bibfiles)
bibtex_bibfiles:
  - references.bib

#######################################################################################
# Information about where the book exists on the web
repository:
  url: https://github.com/lazlou/eot-notes  # Online location of book
  branch: main                              # Branch used when generating links

#######################################################################################
# HTML theme + site options
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  favicon: _static/img/logo.png
  extra_css:
    - _static/custom.css
  extra_js:
    - _static/external_links.js
  use_repository_button: true   # Show "Repository" button
  use_edit_page_button: false   # Show "Edit this page" button
  use_issues_button: false      # Show "Open an issue" button
  collapse_navigation: false    # Keep sidebar expanded
  navigation_depth: 4           # Heading shown in sidebar
  baseurl: "https://lazlou.github.io/eot-notes/"  # Canonical/site base URL
  comments:
    hypothesis: false
    utterances: false
  extra_downloads:
    - path: notebooks/eot_parquet_access.ipynb
    - path: notebooks/eot_parquet_query.ipynb

#######################################################################################
# Sphinx configuration
sphinx:
  # Enabled extensions
  extra_extensions:
    - sphinxcontrib.bibtex
    - sphinx_togglebutton
    - sphinxext.rediraffe

  # conf.py-style settings
  config:
    html_theme: sphinx_book_theme
    html_theme_options:
      logo:
        text: "EOT Web Archive: Parquet"
        image_light: _static/img/logo.png
        image_dark: _static/img/logo.png
      repository_url: https://github.com/lazlou/eot-notes
      repository_branch: main
      use_repository_button: true
    html_last_updated_fmt: "%b %d, %Y"
    html_show_copyright: false
    html_extra_path:
      - _static/img
    language: en

    # Redirects (sphinxext-rediraffe): old-source.md -> new-source.md
    rediraffe_redirects:
      how_to_access_eot_data.md: eot_parquet_access.md

    # Optional sphinxcontrib-bibtex settings (enable when needed)
    # bibtex_default_style: unsrt
    # bibtex_reference_style: label
    # bibtex_bibfiles:
    #   - references.bib

#######################################################################################
# MyST parser and render settings
parse:
  myst_enable_extensions:  # default extensions to enable in the myst parser. See https://myst-parser.readthedocs.io/en/latest/using/syntax-optional.html
    - dollarmath
    - amsmath
    - colon_fence
    - deflist
    - html_image
    - smartquotes
    - linkify
    - substitution
    - attrs_block